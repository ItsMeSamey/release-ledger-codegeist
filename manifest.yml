modules:
  jira:issuePanel:
    - key: release-ledger-panel
      resource: main
      resolver:
        function: resolver
      title: Release Ledger
      icon: resource:main;ledger.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: dist
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs22.x
